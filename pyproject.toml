[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "mcp_arena"
version = "0.4.0"
description = "An opinionated Python library for building MCP (Model Context Protocol) servers with presets and a one-line bridge to LangChain agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Satyam Singh", email = "satyamsingh7734@gmail.com" }
]

keywords = ["mcp", "model-context-protocol", "agents", "ai", "llm"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]

# ------------------------
# Core dependencies (SAFE)
# ------------------------
# Only the bare minimum needed for `import mcp_arena`. Heavy deps are
# pulled in by extras (`pip install mcp-arena[browser]`).
dependencies = [
    "mcp>=1.25,<2.0",
    "python-dotenv>=1.0,<2.0",
    "typing-extensions>=4.8,<5.0",
    "psutil>=7.2,<8.0",
    "pydantic>=2.0,<3.0",
    # CLI
    "typer>=0.9.0",
    "rich>=13.0.0",
]

# ------------------------
# Optional Dependencies
# ------------------------
[project.optional-dependencies]

# Communication
gmail = [
    "google-auth>=2.29,<3.0",
    "google-auth-oauthlib>=1.2,<2.0",
    "google-auth-httplib2>=0.1.0,<1.0",
    "google-api-python-client>=2.130,<3.0"
]

outlook = [
    "msal>=1.28,<2.0"
]

slack = [
    "slack-sdk>=3.27,<4.0"
]

whatsapp = [
    "twilio>=9.0,<10.0"
]

email = [
    "mcp_arena[gmail,outlook]"
]

messaging = [
    "mcp_arena[slack,whatsapp]"
]

communication = [
    "mcp_arena[gmail,outlook,slack,whatsapp]"
]

# AI / Agents
agents = [
    "langchain>=1.0,<2.0",
    "langchain-mcp-adapters>=0.1,<1.0",
]

vectordb = [
    "chromadb>=1.3.5,<2.0",
    "sentence-transformers>=5.2,<6.0"
]

# DevOps / Integrations
github = ["PyGithub>=2.8,<3.0"]
gitlab = ["python-gitlab>=7.0,<8.0"]
bitbucket = ["atlassian-python-api>=4.0,<5.0"]

postgres = ["psycopg2-binary>=2.9,<3.0"]
mongodb = ["pymongo>=4.6,<5.0"]
redis = ["redis>=5.0,<8.0"]

docker = ["docker>=7.1,<8.0"]
kubernetes = ["kubernetes>=28.1,<35.0"]

local_operation = [
    "psutil>=7.2,<8.0",
    "pyautogui>=0.9,<1.0"
]

# ------------------------
# MCP SERVERS (NEW)
# ------------------------

browser = [
    "playwright>=1.45",
    "opencv-python>=4.8",
    "pillow>=10.0",
]

image = [
    "pillow>=10.0",
    "opencv-python>=4.8",
]

video = [
    "moviepy>=1.0.3",
    "numpy>=1.24",
]

audio = [
    "pydub>=0.25",
    "librosa>=0.10",
    "numpy>=1.24",
]

pdf = [
    "PyMuPDF>=1.24",
    "PyPDF2>=3.0",
    "reportlab>=4.0",
    "pdfplumber>=0.10",
]

qrcode = [
    "qrcode[pil]>=7.4",
    "Pillow>=10.0",
]

webscraping = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "selenium>=4.21",
]

spreadsheet = [
    "pandas>=2.2",
    "openpyxl>=3.1",
]

notification = [
    "mcp_arena[communication]"
]

screencapture = [
    "pyautogui>=0.9",
]

cloudstorage = [
    "boto3>=1.42",
    "google-cloud-storage>=2.16",
]

generic_api = [
    "httpx>=0.27",
]

mail = [
    "mcp_arena[gmail,outlook]"
]

# ------------------------
# Dev
# ------------------------
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "black>=24.0,<26.0",
    "isort>=5.12,<6.0",
    "ruff>=0.12,<1.0",
    "mypy>=1.7,<2.0",
    "pre-commit>=3.5,<4.0"
]

# ------------------------
# Bundles
# ------------------------
all = [
    "mcp_arena[agents,vectordb,github,gitlab,bitbucket,postgres,mongodb,redis,docker,kubernetes,local_operation,communication]",
    "mcp_arena[browser,image,video,audio,pdf,qrcode,webscraping,spreadsheet,notification,screencapture,cloudstorage,generic_api,mail]",
]

complete = [
    "mcp_arena[all,dev]"
]

# ------------------------
# CLI
# ------------------------
[project.scripts]
mcp_arena = "mcp_arena.cli:app"
mcp-arena = "mcp_arena.cli:app"

# ------------------------
# URLs
# ------------------------
[project.urls]
Homepage = "https://github.com/SatyamSingh8306/mcp_arena"
Repository = "https://github.com/SatyamSingh8306/mcp_arena"
Issues = "https://github.com/SatyamSingh8306/mcp_arena/issues"

# ------------------------
# Hatch Build
# ------------------------
[tool.hatch.build.targets.wheel]
packages = ["mcp_arena"]

# ------------------------
# Tooling
# ------------------------
[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true