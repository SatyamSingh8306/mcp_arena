name: Manual Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.4.2). Empty = use existing git tag at HEAD."
        required: false
        default: ""
      target:
        description: "Publish target"
        type: choice
        required: true
        default: pypi
        options:
          - pypi
          - testpypi

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build hatchling twine

      - name: Verify tag matches pyproject
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          TAG="${TAG#v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.loads(open('pyproject.toml', encoding='utf-8').read())['project']['version'])")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Tag ($TAG) does not match pyproject version ($PKG_VERSION)."
            exit 1
          fi
          echo "pyproject version: $PKG_VERSION"

      - name: Run tests
        run: |
          python -m pip install -e ".[all]"
          python -m pip install pytest pytest-asyncio
          pytest tests/ -v

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI
        if: github.event.inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to TestPyPI
        if: github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

      - name: Create GitHub release
        if: github.event.inputs.target == 'pypi'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
